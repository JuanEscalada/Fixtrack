{% extends "base.html" %}

{% block content %}

<h2>
    {% if repair %}
        Edit Repair
    {% else %}
        New Repair
    {% endif %}
</h2>

<form method="post">

    <div>
        <label for="customer">Customer</label>
        <input
            type="text"
            id="customer"
            name="customer"
            value="{{ repair.customer if repair else '' }}"
            required
        >
    </div>

    <br>

    <div>
        <label for="item">Item</label>
        <input
            type="text"
            id="item"
            name="item"
            value="{{ repair.item if repair else '' }}"
            required
        >
    </div>

    <br>

    <div>
        <label for="problem">Problem</label>
        <textarea
            id="problem"
            name="problem"
            required
        >{{ repair.problem if repair else '' }}</textarea>
    </div>

    <br>

    {% if repair %}
        <div>
            <label for="status">Status</label>

            <select id="status" name="status">
                <option
                    value="Received"
                    {% if repair.status == "Received" %}selected{% endif %}
                >
                    Received
                </option>

                <option
                    value="Diagnosing"
                    {% if repair.status == "Diagnosing" %}selected{% endif %}
                >
                    Diagnosing
                </option>

                <option
                    value="Waiting for parts"
                    {% if repair.status == "Waiting for parts" %}selected{% endif %}
                >
                    Waiting for parts
                </option>

                <option
                    value="In progress"
                    {% if repair.status == "In progress" %}selected{% endif %}
                >
                    In progress
                </option>

                <option
                    value="Ready"
                    {% if repair.status == "Ready" %}selected{% endif %}
                >
                    Ready
                </option>

                <option
                    value="Delivered"
                    {% if repair.status == "Delivered" %}selected{% endif %}
                >
                    Delivered
                </option>

                <option
                    value="Cancelled"
                    {% if repair.status == "Cancelled" %}selected{% endif %}
                >
                    Cancelled
                </option>
            </select>
        </div>

        <br>
    {% endif %}

    <button type="submit">
        Save
    </button>

</form>

<p>
    <a href="{{ url_for('main.index') }}">
        Back to repairs
    </a>
</p>

{% endblock %}
