{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card">
            <div class="card-body p-4">

                <h1 class="mb-4">
                    {% if repair %}
                        Edit Repair
                    {% else %}
                        New Repair
                    {% endif %}
                </h1>


                <form method="post">

                    <div class="mb-3">
                        <label for="customer" class="form-label">
                            Customer
                        </label>

                        <input
                            type="text"
                            id="customer"
                            name="customer"
                            class="form-control"
                            value="{{ repair.customer if repair else '' }}"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label for="item" class="form-label">
                            Item
                        </label>

                        <input
                            type="text"
                            id="item"
                            name="item"
                            class="form-control"
                            value="{{ repair.item if repair else '' }}"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label for="problem" class="form-label">
                            Problem
                        </label>

                        <textarea
                            id="problem"
                            name="problem"
                            class="form-control"
                            rows="4"
                            required
                        >{{ repair.problem if repair else '' }}</textarea>
                    </div>


                    {% if repair %}

                    <div class="mb-3">

                        <label for="status" class="form-label">
                            Status
                        </label>

                        <select
                            id="status"
                            name="status"
                            class="form-select"
                        >

                            <option
                                value="Received"
                                {% if repair.status == "Received" %}selected{% endif %}
                            >
                                Received
                            </option>

                            <option
                                value="Diagnosing"
                                {% if repair.status == "Diagnosing" %}selected{% endif %}
                            >
                                Diagnosing
                            </option>

                            <option
                                value="Waiting for parts"
                                {% if repair.status == "Waiting for parts" %}selected{% endif %}
                            >
                                Waiting for parts
                            </option>

                            <option
                                value="In progress"
                                {% if repair.status == "In progress" %}selected{% endif %}
                            >
                                In progress
                            </option>

                            <option
                                value="Ready"
                                {% if repair.status == "Ready" %}selected{% endif %}
                            >
                                Ready
                            </option>

                            <option
                                value="Delivered"
                                {% if repair.status == "Delivered" %}selected{% endif %}
                            >
                                Delivered
                            </option>

                            <option
                                value="Cancelled"
                                {% if repair.status == "Cancelled" %}selected{% endif %}
                            >
                                Cancelled
                            </option>

                        </select>

                    </div>

                    {% endif %}


                    <div class="d-flex gap-2 mt-4">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save
                        </button>

                        <a
                            href="{{ url_for('main.index') }}"
                            class="btn btn-outline-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>
        </div>

    </div>

</div>

{% endblock %}
