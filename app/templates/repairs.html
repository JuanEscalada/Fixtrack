{% extends "base.html" %}

{% block content %}

<h2>Repairs</h2>

<p>
    <a href="{{ url_for('main.new_repair') }}">
        New Repair
    </a>
</p>

<ul>
    {% for repair in repairs %}
        <li>
            <a href="{{ url_for('main.repair_detail', repair_id=repair.id) }}">
                {{ repair.customer }} — {{ repair.item }}
            </a>
            — {{ repair.status }}
        </li>
    {% endfor %}
</ul>

{% endblock %}
