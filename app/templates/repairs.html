{% extends "base.html" %}

{% block content %}

<h2>Repairs</h2>

<p>
    <a href="{{ url_for('main.new_repair') }}">
        New Repair
    </a>
</p>

<form method="get">
    <label for="status">Filter by status</label>

    <select id="status" name="status">
        <option value="">All</option>

        <option
            value="Received"
            {% if selected_status == "Received" %}selected{% endif %}
        >
            Received
        </option>

        <option
            value="Diagnosing"
            {% if selected_status == "Diagnosing" %}selected{% endif %}
        >
            Diagnosing
        </option>

        <option
            value="Waiting for parts"
            {% if selected_status == "Waiting for parts" %}selected{% endif %}
        >
            Waiting for parts
        </option>

        <option
            value="In progress"
            {% if selected_status == "In progress" %}selected{% endif %}
        >
            In progress
        </option>

        <option
            value="Ready"
            {% if selected_status == "Ready" %}selected{% endif %}
        >
            Ready
        </option>

        <option
            value="Delivered"
            {% if selected_status == "Delivered" %}selected{% endif %}
        >
            Delivered
        </option>

        <option
            value="Cancelled"
            {% if selected_status == "Cancelled" %}selected{% endif %}
        >
            Cancelled
        </option>
    </select>

    <button type="submit">
        Filter
    </button>
</form>

<ul>
    {% for repair in repairs %}
        <li>
            <a href="{{ url_for('main.repair_detail', repair_id=repair.id) }}">
                {{ repair.customer }} — {{ repair.item }}
            </a>
            — {{ repair.status }}
        </li>
    {% endfor %}
</ul>

{% endblock %}
