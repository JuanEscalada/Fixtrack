{% extends "base.html" %}

{% block content %}

<h2>Repairs</h2>

<p>
    <a href="{{ url_for('main.new_repair') }}">
        New Repair
    </a>
</p>

<ul>
    {% for repair in repairs %}
        <li>
            {{ repair.customer }}
            —
            {{ repair.item }}
            —
            {{ repair.status }}
        </li>
    {% endfor %}
</ul>

{% endblock %}
